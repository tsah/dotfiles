onboarding = false

[session]
resume_agents_on_restore = false

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_right = [
  { type = "command", command = "~/dotfiles/bin/herdr-active-workspace-label", interval_seconds = 2, timeout_seconds = 1 },
  { type = "hostname" },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "system"

# Mirror the tmux keymap. Herdr workspaces correspond to tmux sessions,
# tabs to tmux windows, and panes to tmux panes.
[keys]
prefix = "ctrl+b"

# General
detach = "prefix+d"
reload_config = "prefix+q"
goto = ["prefix+g", "alt+o"]

# Panes
split_horizontal = ["prefix+minus", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+w"]
copy_mode = ["prefix+[", "alt+j"]
focus_pane_left = ["prefix+left", "ctrl+alt+left"]
focus_pane_right = ["prefix+right", "ctrl+alt+right"]
focus_pane_up = ["prefix+up", "ctrl+alt+up"]
focus_pane_down = ["prefix+down", "ctrl+alt+down"]
resize_mode = ""
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_right = "ctrl+alt+shift+right"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_down = "ctrl+alt+shift+down"
swap_pane_up = ""
rename_pane = ""

# Tabs (tmux windows)
new_tab = ["prefix+c", "alt+t"]
rename_tab = "prefix+r"
close_tab = "prefix+k"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"
switch_tab = ["prefix+1..9", "alt+1..9"]

# Workspaces (tmux sessions)
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Open the pull request for the focused pane's current repository.
[[keys.command]]
key = "alt+g"
type = "shell"
command = "~/dotfiles/bin/tmux-open-current-pr.sh \"$HERDR_ACTIVE_PANE_CWD\""
description = "Open current PR"

